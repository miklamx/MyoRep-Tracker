<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MyoRep Tracker</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React & ReactDOM CDN -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <!-- Babel Standalone (Required to translate JSX in browser) -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-slate-950 text-slate-100">
  <div id="root"></div>

  <!-- CRITICAL: type="text/babel" tells Babel to compile this code -->
  <script type="text/babel">
    const { useState, useEffect } = React;

    // --- PASTE YOUR React App CODE HERE ---
    function App() {
      return (
        <div class="p-8 text-center text-white">
          <h1 class="text-2xl font-bold">MyoRep Tracker is Active!</h1>
        </div>
      );
    }

    // Render component into root
    const container = document.getElementById('root');
    const root = ReactDOM.createRoot(container);
    root.render(<App />);
  </script>
</body>
</html>
