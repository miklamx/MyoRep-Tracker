      function getAudioContext() {
        const AudioCtor = window.AudioContext || window.webkitAudioContext;
        if (!AudioCtor) return null;
        if (!window.__myorepAudioContext) {
          window.__myorepAudioContext = new AudioCtor();
        }
        return window.__myorepAudioContext;
      }

      function playChime(freq = 440, type = 'sine', duration = 0.15) {
        try {
          const ctx = getAudioContext();
          if (!ctx) return;
          if (ctx.state === 'suspended') ctx.resume();

          const osc = ctx.createOscillator();
          const gain = ctx.createGain();

          osc.type = type;
          osc.frequency.setValueAtTime(freq, ctx.currentTime);
          gain.gain.setValueAtTime(0.07, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + duration);

          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start();
          osc.stop(ctx.currentTime + duration);
        } catch (e) {}
      }

      function playGoChime() {
        playChime(587.33, 'triangle', 0.2);
        setTimeout(() => playChime(880, 'sine', 0.4), 150);
      }

      function App() {
        const [activeTab, setActiveTab] = useState('workout');
        
        const [selectedMuscle, setSelectedMuscle] = useState('ALL');
        const [selectedExerciseId, setSelectedExerciseId] = useState(EXERCISES[0].id);
        const [tgLevel, setTgLevel] = useState(5);
        const [selectedBand, setSelectedBand] = useState('none');

        const [activationReps, setActivationReps] = useState(12);
        const [activationDone, setActivationDone] = useState(false);
        const [miniSets, setMiniSets] = useState([]);
        const [selectedReps, setSelectedReps] = useState(null);
        const [restTimer, setRestTimer] = useState(0);
        const [isResting, setIsResting] = useState(false);
        const [isCompleted, setIsCompleted] = useState(false);
        const [history, setHistory] = useState([]);

        const timerRef = useRef(null);

        const filteredExercises = selectedMuscle === 'ALL' 
          ? EXERCISES 
          : EXERCISES.filter(ex => ex.category === selectedMuscle);

        const exercise = EXERCISES.find((item) => item.id === selectedExerciseId) || filteredExercises[0] || EXERCISES[0];

        useEffect(() => {
          try {
            const loaded = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
            if (Array.isArray(loaded)) setHistory(loaded);
          } catch (e) {
            console.warn('Failed to load workout history', e);
          }
        }, []);

        useEffect(() => {
          try {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(history));
          } catch (e) {
            console.warn('Failed to save workout history', e);
          }
        }, [history]);

        useEffect(() => {
          return () => {
            if (timerRef.current) clearTimeout(timerRef.current);
          };
        }, []);

        useEffect(() => {
          if (!isResting) return;

          if (restTimer <= 0) {
            setIsResting(false);
            setRestTimer(0);
            playGoChime();
            return;
          }

          timerRef.current = setTimeout(() => {
            setRestTimer((prev) => prev - 1);
          }, 1000);

          return () => {
            if (timerRef.current) {
              clearTimeout(timerRef.current);
              timerRef.current = null;
            }
          };
        }, [isResting, restTimer]);

        useEffect(() => {
          if (isResting && restTimer > 0 && restTimer % 3 === 0) {
            playChime(350, 'sine', 0.1);
          }
        }, [isResting, restTimer]);

        const resetSession = () => {
          setMiniSets([]);
          setSelectedReps(null);
          setActivationReps(12);
          setActivationDone(false);
          setIsResting(false);
          setRestTimer(0);
          setIsCompleted(false);
        };

        const handleMuscleChange = (group) => {
          setSelectedMuscle(group);
          const firstInGroup = group === 'ALL' ? EXERCISES[0] : EXERCISES.find(ex => ex.category === group);
          if (firstInGroup) {
            setSelectedExerciseId(firstInGroup.id);
          }
          resetSession();
        };

        const handleExerciseChange = (event) => {
          const nextId = event.target.value;
          setSelectedExerciseId(nextId);
          resetSession();
        };

        const handleStartActivationRest = () => {
          setActivationDone(true);
          setRestTimer(15);
          setIsResting(true);
          playChime(440, 'sine', 0.15);
        };

        const handleSelectCard = (val) => {
          if (isResting || isCompleted || !activationDone) return;
          setSelectedReps(val);
        };

        const handleConfirmAndStartRest = () => {
          if (selectedReps === null || isResting || isCompleted) return;

          const repsToRecord = selectedReps;
          const nextMiniSets = [...miniSets, repsToRecord];
          setMiniSets(nextMiniSets);
          setSelectedReps(null);

          if (repsToRecord < 3 || nextMiniSets.length >= 5) {
            setIsCompleted(true);
            setIsResting(false);
            setRestTimer(0);
            playGoChime();
            return;
          }

          setRestTimer(15);
          setIsResting(true);
          playChime(440, 'sine', 0.15);
        };

        const handleSkipRest = () => {
          setIsResting(false);
          setRestTimer(0);
          playGoChime();
        };

        const saveWorkout = () => {

            id: Date.now(),
            date: new Date().toLocaleString(),
            exercise: exercise.name,
            equipment: exercise.equipment,
            setting: `TG Level ${tgLevel} + Band: ${bandLabel}`,
            activationReps,
            miniSets,
            totalReps: activationReps + miniSets.reduce((sum, value) => sum + value, 0)
          };

          setHistory((previous) => [newEntry, ...previous]);
          resetSession();
        };

        const currentBreath = restTimer <= 0 ? 1 : Math.min(5, Math.ceil((15 - restTimer) / 3) || 1);

        return (

                        onClick={() => handleMuscleChange(group)}
