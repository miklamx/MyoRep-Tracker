      function getAudioContext() {
        const AudioCtor = window.AudioContext || window.webkitAudioContext;
        if (!AudioCtor) return null;
        if (!window.__myorepAudioContext) {
          window.__myorepAudioContext = new AudioCtor();
        }
        return window.__myorepAudioContext;
      }

      function playChime(freq = 440, type = 'sine', duration = 0.15) {
        try {
          const ctx = getAudioContext();
          if (!ctx) return;
          if (ctx.state === 'suspended') ctx.resume();

          const osc = ctx.createOscillator();
          const gain = ctx.createGain();

          osc.type = type;
          osc.frequency.setValueAtTime(freq, ctx.currentTime);
          gain.gain.setValueAtTime(0.07, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + duration);

          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start();
          osc.stop(ctx.currentTime + duration);
        } catch (e) {}
      }

      function playGoChime() {
        playChime(587.33, 'triangle', 0.2);
        setTimeout(() => playChime(880, 'sine', 0.4), 150);
      }

        const [activationDone, setActivationDone] = useState(false);
        const [miniSets, setMiniSets] = useState([]);
        const [selectedReps, setSelectedReps] = useState(null);
        const [restTimer, setRestTimer] = useState(0);
        const [isResting, setIsResting] = useState(false);
        const [isCompleted, setIsCompleted] = useState(false);
        const [history, setHistory] = useState([]);

        const timerRef = useRef(null);

        const parsedBodyWeight = parseFloat(userBodyWeightStr) || 0;

        const filteredExercises = selectedMuscle === 'ALL' 
          ? EXERCISES 
          : EXERCISES.filter(ex => ex.category === selectedMuscle);

        const exercise = EXERCISES.find((item) => item.id === selectedExerciseId) || filteredExercises[0] || EXERCISES[0];
        const selectedBandObj = BAND_OPTIONS.find(b => b.id === selectedBand) || BAND_OPTIONS[0];

        // Calculated effective working load
        const activeLvlObj = TG_FIT_LEVELS.find(l => l.level === tgLevel) || TG_FIT_LEVELS[4];
        const currentGlideboardLoad = Math.round(parsedBodyWeight * activeLvlObj.bodyWeightPct);
        const currentTotalWorkingLoad = currentGlideboardLoad + selectedBandObj.tension;

        useEffect(() => {
          try {
            const loaded = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
            if (Array.isArray(loaded)) setHistory(loaded);
          } catch (e) {
            console.warn('Failed to load workout history', e);
          }
        }, []);

        useEffect(() => {
          try {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(history));
          } catch (e) {
            console.warn('Failed to save workout history', e);
          }
        }, [history]);

        useEffect(() => {
          return () => {
            if (timerRef.current) clearTimeout(timerRef.current);
          };
        }, []);

        useEffect(() => {
          if (!isResting) return;

          if (restTimer <= 0) {
            setIsResting(false);
            setRestTimer(0);
            playGoChime();
            return;
          }

          timerRef.current = setTimeout(() => {
            setRestTimer((prev) => prev - 1);
          }, 1000);

          return () => {
            if (timerRef.current) {
              clearTimeout(timerRef.current);
              timerRef.current = null;
            }
          };
        }, [isResting, restTimer]);

        useEffect(() => {
          if (isResting && restTimer > 0 && restTimer % 3 === 0) {
            playChime(350, 'sine', 0.1);
          }
        }, [isResting, restTimer]);

          setRestTimer(15);

            setIsResting(false);
            setRestTimer(0);
            playGoChime();
            return;

          setIsResting(true);
          playChime(440, 'sine', 0.15);

                          type="button"
                          onClick={handleConfirmAndStartRest}
                          className="w-full py-3 bg-brand-cyan hover:bg-cyan-400 text-brand-base font-black text-xs rounded-xl transition-all uppercase tracking-wider shadow-lg shadow-cyan-950/30 mt-4"
                        >
                          {selectedReps >= 3
                            ? `Confirm ${selectedReps} Reps & Start 5-Breath Rest ➔`
                            : `Confirm ${selectedReps} Reps & Complete Exercise ➔`}
                        </button>
                      ) : (
                        <p className="text-xs text-brand-muted text-center italic py-1">
                          Tap a card above to select your completed reps.
                        </p>
                      )}
                    </div>
                  )}

                  {isCompleted && (
                    <div className="mt-4 bg-brand-base border border-brand-cyan/60 p-4 rounded-lg text-center">
                      <span className="text-xs font-black text-brand-cyan block mb-1">✓ EXERCISE COMPLETE</span>
                      <p className="text-xs text-brand-muted">Auto-regulation trigger reached. Maximum muscle fiber recruitment achieved.</p>
                      <button
                        type="button"
                        onClick={saveWorkout}
                        className="mt-3 w-full py-2.5 bg-brand-cyan text-brand-base font-black text-xs rounded-lg hover:bg-cyan-400 transition-colors uppercase tracking-wider"
                      >
                        SAVE TO HISTORY LOG
                      </button>
                    </div>
                  )}
                </div>
              </div>
            ) : (
              <div className="space-y-3">
                {history.length === 0 ? (
                  <div className="text-center py-12 bg-brand-surface rounded-xl border border-slate-700/50">
                    <p className="text-brand-muted text-sm font-semibold">No saved workouts yet.</p>
                    <p className="text-xs text-slate-500 mt-1">Complete a Myo-Rep session to view history.</p>
                  </div>
                ) : (
                  history.map((log) => (
                    <div key={log.id} className="bg-brand-surface p-4 rounded-xl border border-slate-700/50">
                      <div className="flex justify-between items-start mb-2">
                        <div>
                          <h4 className="font-bold text-sm text-brand-text">{log.exercise}</h4>
                          <span className="text-xs text-brand-muted">{log.date}</span>
                        </div>
                        <span className="text-xs font-bold px-2 py-0.5 rounded bg-brand-base text-brand-cyan border border-slate-800">
                          {log.workingLoad || log.setting}
                        </span>
                      </div>
                      <div className="flex items-center justify-between text-xs pt-2 border-t border-slate-800">
                        <span className="text-brand-muted">Activation: <strong className="text-brand-text">{log.activationReps} reps</strong></span>
                        <span className="text-brand-muted">Mini-Sets: <strong className="text-brand-cyan font-mono">[{log.miniSets.join(', ')}]</strong></span>
                        <span className="text-brand-muted">Total: <strong className="text-brand-text font-mono">{log.totalReps}</strong></span>
                      </div>
                    </div>
                  ))
                )}
              </div>
            )}
          </div>
        );
      }

      const root = ReactDOM.createRoot(document.getElementById('root'));
      root.render(<App />);
    </script>
  </body>
</html>
